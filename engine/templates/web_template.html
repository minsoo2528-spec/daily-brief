<title>Wholesale Daily Brief</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: 고정 헤더(브리프명·기준일) + 가로 탭바, 탭마다 한 섹션. 표는 숫자 정렬, 차트는 단일 축 라인. */
:root {
  --bg: #f4f6f8; --surface: #ffffff; --ink: #142031; --ink-2: #4c5666; --muted: #858d99;
  --line: #e0e4ea; --brand: #1b2a44; --brand-ink: #ffffff; --tab-on: #1b2a44;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --prior: #9aa2ad;
  --check: #b4472a; --check-bg: #fbf1ed; --soft: #eef1f5;
  --sig-red: #c0392b; --sig-red-bg: #fdeeec; --sig-org: #c76a00; --sig-org-bg: #fff4e5;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e131a; --surface: #151c26; --ink: #e7ebf0; --ink-2: #b1bac6; --muted: #7c8693;
  --line: #253041; --brand: #0b1220; --brand-ink: #e7ebf0; --tab-on: #9fb7e0;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --prior: #6c7683;
  --check: #e88a6c; --check-bg: #2a1b16; --soft: #1b2430; --sig-red: #ff7b6b; --sig-red-bg: #33191a; --sig-org: #f0a54a; --sig-org-bg: #30230f; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e131a; --surface: #151c26; --ink: #e7ebf0; --ink-2: #b1bac6; --muted: #7c8693;
  --line: #253041; --brand: #0b1220; --brand-ink: #e7ebf0; --tab-on: #9fb7e0;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --prior: #6c7683;
  --check: #e88a6c; --check-bg: #2a1b16; --soft: #1b2430; --sig-red: #ff7b6b; --sig-red-bg: #33191a; --sig-org: #f0a54a; --sig-org-bg: #30230f; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }

.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--brand); color: var(--brand-ink); }
.top .wrap { padding-block: 14px 0; }
.brandrow { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.brandrow h1 { margin: 0; font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; }
.brandrow .sub { font-size: 0.78rem; opacity: 0.72; margin-top: 2px; color: inherit; font-weight: 400; }
.brandrow .date { text-align: right; font-size: 0.8rem; opacity: 0.85; line-height: 1.35; }
.brandrow .date b { display: block; font-size: 0.98rem; opacity: 1; font-weight: 600; }
.pill { display: inline-block; font-size: 0.68rem; letter-spacing: 0.04em; border: 1px solid currentColor; border-radius: 999px; padding: 0 8px; margin-left: 8px; vertical-align: 2px; opacity: 0.8; }
nav.cats { display: flex; gap: 6px; margin-top: 12px; }
nav.cats button { appearance: none; border: 1px solid color-mix(in srgb, var(--brand-ink) 40%, transparent); background: transparent; color: inherit; border-radius: 999px; padding: 5px 14px; font: 600 0.86rem var(--font); cursor: pointer; opacity: 0.8; display: inline-flex; align-items: center; gap: 6px; }
nav.cats button:hover { opacity: 1; }
nav.cats button[aria-pressed="true"] { background: var(--brand-ink); color: var(--brand); border-color: var(--brand-ink); opacity: 1; }
nav.cats button:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
nav.cats .cbadge { min-width: 18px; padding: 0 5px; border-radius: 9px; font: 600 0.7rem/18px var(--mono); text-align: center; background: var(--sig-red); color: #fff; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 4px; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { flex: 0 0 auto; appearance: none; border: 0; background: transparent; color: inherit; opacity: 0.68; font: 500 0.92rem var(--font); padding: 10px 14px 12px; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
nav.tabs button:hover { opacity: 0.95; }
nav.tabs button[aria-selected="true"] { opacity: 1; font-weight: 700; border-bottom-color: currentColor; }
nav.tabs button:focus-visible { outline: 2px solid currentColor; outline-offset: -4px; }

main .wrap { padding-block: 22px 40px; }
section.panel { display: grid; gap: 18px; }
.panel h2 { margin: 0; font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; min-width: 0; }
.card h3 { margin: 0 0 10px; font-size: 0.95rem; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }

.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
@media (max-width: 760px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.kpi .k { font-size: 0.76rem; color: var(--ink-2); letter-spacing: 0.02em; }
.kpi .v { font: 500 1.35rem var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.kpi .d { font: 400 0.78rem var(--mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }

ul.lines { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
ul.lines li { padding-left: 14px; position: relative; max-width: 68ch; }

.news { display: grid; gap: 14px; }
.news article { display: grid; gap: 3px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.news article:last-child { border-bottom: 0; padding-bottom: 0; }
.news b { font-weight: 700; }
.src { color: var(--muted); font-size: 0.74rem; }
.comment { background: var(--soft); border-radius: 8px; padding: 12px 14px; font-size: 0.9rem; color: var(--ink-2); max-width: 78ch; }
.comment b { color: var(--ink); }
.note { font-size: 0.74rem; color: var(--muted); margin-top: 6px; }

.tbl { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
th { font-weight: 500; color: var(--ink-2); font-size: 0.76rem; text-align: right; padding: 6px 8px; border-bottom: 1.5px solid var(--ink); white-space: nowrap; }
td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--line); font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; font-family: var(--font); }
td.v { font-weight: 500; color: var(--ink); }
td.up { color: var(--ink); } td.dn { color: var(--ink); }
.sign { display: inline-block; width: 0.9em; text-align: center; color: var(--muted); }

.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.76rem; color: var(--ink-2); margin-bottom: 4px; }
.chart .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: 3px; margin-right: 5px; }
.chart .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font-size: 0.76rem; box-shadow: 0 4px 14px rgba(0,0,0,.12); white-space: nowrap; display: none; }
.chart .tip b { font-family: var(--mono); font-weight: 500; }

.cal { display: grid; gap: 0; }
.cal .row { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.cal .row:last-child { border-bottom: 0; }
.cal .d { font: 500 0.95rem var(--mono); }
.cal .d small { display: block; font: 400 0.74rem var(--font); color: var(--muted); }
.cal .key .d { color: var(--s1); }
.chk { display: inline-block; font-size: 0.72rem; color: var(--check); background: var(--check-bg); border-radius: 4px; padding: 0 6px; margin-left: 6px; white-space: nowrap; }

.kmbk { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; }
.kmbk div { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 0.86rem; min-width: 0; }
.kmbk span:last-child { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
.kmbk em { font-style: normal; color: var(--muted); font-size: 0.74rem; margin-left: 6px; }
@media (max-width: 520px) { .kmbk { grid-template-columns: minmax(0, 1fr); } }

footer.foot { border-top: 1px solid var(--line); }
footer .wrap { padding-block: 18px 28px; font-size: 0.74rem; color: var(--muted); display: grid; gap: 6px; }
footer ul { margin: 0; padding-left: 16px; display: grid; gap: 2px; }
.empty { color: var(--muted); font-size: 0.9rem; }

.feed { display: grid; gap: 12px; }
.art { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; }
.art:hover { border-color: var(--ink-2); }
.art:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
.art .fig { display: grid; align-content: center; gap: 2px; border-right: 1px solid var(--line); padding-right: 12px; min-width: 0; }
.art .fig b { font: 500 1.25rem var(--mono); letter-spacing: -0.02em; overflow-wrap: anywhere; }
.art .fig span { font-size: 0.72rem; color: var(--muted); line-height: 1.35; }
.art h3 { margin: 0 0 3px; font-size: 1rem; line-height: 1.4; }
.art .meta { font-size: 0.75rem; color: var(--muted); margin-bottom: 6px; }
.art p { margin: 0; color: var(--ink-2); font-size: 0.9rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.art .more { margin-top: 8px; font-size: 0.78rem; color: var(--s1); font-weight: 600; }
@media (max-width: 560px) { .art { grid-template-columns: minmax(0, 1fr); } .art .fig { border-right: 0; border-bottom: 1px solid var(--line); padding: 0 0 8px; } }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; grid-template-rows: auto auto auto 1fr auto; gap: 6px; cursor: pointer; text-align: left; font: inherit; color: inherit; min-height: 210px; }
.tile:hover { border-color: var(--ink-2); }
.tile:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
.chip { justify-self: start; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.02em; padding: 2px 8px; border-radius: 999px; background: var(--soft); color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.chip i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.tile .big { font: 500 1.9rem var(--mono); letter-spacing: -0.03em; line-height: 1.1; overflow-wrap: anywhere; }
.tile .lab { font-size: 0.74rem; color: var(--muted); }
.tile h3 { margin: 4px 0 0; font-size: 0.98rem; line-height: 1.4; }
.tile .meta { font-size: 0.74rem; color: var(--muted); }
.detail { display: grid; gap: 16px; max-width: 760px; }
.back { justify-self: start; appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 14px; font: 500 0.85rem var(--font); cursor: pointer; }
.back:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
.detail h2 { font-size: 1.35rem; line-height: 1.35; }
.detail .meta { color: var(--muted); font-size: 0.82rem; }
.detail .hero { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding: 14px 16px; background: var(--soft); border-radius: 10px; }
.detail .hero b { font: 500 2.2rem var(--mono); letter-spacing: -0.03em; }
.detail .hero span { color: var(--ink-2); font-size: 0.88rem; }
.detail p.sum { margin: 0; font-size: 1rem; line-height: 1.75; max-width: 68ch; }
.detail ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; color: var(--ink-2); max-width: 68ch; }
.golink { justify-self: start; display: inline-flex; gap: 8px; align-items: center; background: var(--brand); color: var(--brand-ink); text-decoration: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; }
.golink:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
.wk table { min-width: 760px; table-layout: fixed; }
.wk th { text-align: left; font-size: 0.82rem; color: var(--ink); }
.wk th small { display: block; color: var(--muted); font-weight: 400; }
.wk th.today, .wk td.today { background: var(--soft); }
.wk td { vertical-align: top; text-align: left; font-family: var(--font); white-space: normal; font-size: 0.8rem; }
.wk td.rh { font-weight: 600; color: var(--ink-2); width: 92px; }
.wk .it { display: flex; justify-content: space-between; gap: 6px; padding: 1px 0; }
.wk .it span:last-child { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.wk .plus span:last-child { color: var(--s3); } .wk .minus span:last-child { color: var(--s2); }
.wk .ev { display: inline-block; font-size: 0.72rem; font-weight: 600; padding: 1px 6px; border-radius: 4px; background: var(--brand); color: var(--brand-ink); }
.wk td.num { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.wk td.num small { display: block; color: var(--muted); font-size: 0.7rem; }
.mon { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.mon .h { font-size: 0.74rem; color: var(--muted); text-align: center; padding: 6px 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.mon .c { min-height: 92px; padding: 5px 6px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: grid; align-content: start; gap: 3px; min-width: 0; }
.mon .c.out { background: var(--bg); color: var(--muted); }
.mon .c.we .n { color: var(--muted); }
.mon .c.today { box-shadow: inset 0 0 0 2px var(--s1); }
.mon .n { font: 500 0.8rem var(--mono); }
.mon .e { font-size: 0.7rem; line-height: 1.3; padding: 2px 5px; border-radius: 4px; background: var(--soft); color: var(--ink); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.mon .e.key { background: var(--brand); color: var(--brand-ink); }

@media (max-width: 560px) { .mon .c { min-height: 64px; padding: 3px; } .mon .e { -webkit-line-clamp: 1; font-size: 0.64rem; } }
@media (prefers-reduced-motion: no-preference) { section.panel { animation: fade .18s ease-out; } }
@keyframes fade { from { opacity: .4; } to { opacity: 1; } }

/* 채권 발행·투자자 · 대기업 단기자금 */
.kpis.three { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 10px; }
.kpis.two { grid-template-columns: minmax(0, 1fr); margin-bottom: 10px; }
.slegend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.78rem; color: var(--ink-2); margin: 2px 0 8px; }
.slegend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.sbar { display: flex; width: 120px; height: 8px; border-radius: 4px; overflow: hidden; background: var(--soft); gap: 1px; }
.sbar i { display: block; height: 100%; }
table.deals td small, table.deals th small { display: block; font-size: 0.72rem; color: var(--muted); font-weight: 400; white-space: nowrap; }
table.deals td a, .upc a { color: var(--ink); font-weight: 600; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }

td.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
td.n.pos { color: var(--s1); } td.n.neg { color: var(--check); }
table.inv th { text-align: right; } table.inv th:first-child { text-align: left; }
.upc { margin-top: 12px; padding: 10px 12px; background: var(--soft); border-radius: 8px; font-size: 0.86rem; display: grid; gap: 4px; }
.upc .d { display: inline-block; min-width: 72px; font-family: var(--mono); color: var(--ink-2); }
.sub { margin: 14px 0 4px; font-size: 0.8rem; font-weight: 700; color: var(--ink-2); }
.wkbars { display: grid; gap: 6px; margin: 4px 0 6px; }
.wb { display: grid; grid-template-columns: 70px minmax(0, 1fr) 96px; gap: 8px; align-items: center; font-size: 0.82rem; }
.wb .l { color: var(--ink-2); } .wb .b { height: 12px; background: var(--soft); border-radius: 3px; overflow: hidden; }
.wb .b i { display: block; height: 100%; background: var(--s3); border-radius: 3px; }
.wb .v { font-family: var(--mono); text-align: right; font-variant-numeric: tabular-nums; } .wb .v small { color: var(--muted); margin-left: 4px; }
.mon .e.corp { background: color-mix(in srgb, var(--s3) 16%, transparent); color: var(--ink); }
.cal .row.corp .d { color: var(--s3); }

/* 현재 시황 */

.mkt .up { color: var(--sig-red); } .mkt .dn { color: var(--s1); }
.usrow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }

.usrow b { font: 500 0.98rem var(--mono); font-variant-numeric: tabular-nums; }
.usrow em { font: 400 0.78rem var(--mono); font-style: normal; font-variant-numeric: tabular-nums; }
@media (max-width: 760px) { .usrow { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
/* 공문 일정 BETA */
.betatag { display: inline-block; margin-left: 6px; padding: 0 5px; border-radius: 4px; font: 700 0.62rem/16px var(--mono); letter-spacing: 0.04em; border: 1px solid currentColor; opacity: 0.85; vertical-align: 2px; }
.betanote { font-size: 0.82rem; color: var(--sig-org); background: var(--sig-org-bg); border-radius: 8px; padding: 8px 12px; }

.ntype.t-만기·청산 { background: var(--sig-org-bg); color: var(--sig-org); }
.nev { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
.nev:last-child { border-bottom: 0; }
.nev .d { font: 500 0.92rem var(--mono); } .nev .d small { display: block; font: 400 0.72rem var(--font); color: var(--muted); }
.nev .dd { font: 600 0.72rem var(--mono); color: var(--sig-red); } .nev .dd.far { color: var(--muted); }
.nev .f { font-weight: 600; font-size: 0.9rem; } .nev .l { font-size: 0.84rem; color: var(--ink-2); }
.nev .inv { font-size: 0.76rem; color: var(--muted); margin-top: 2px; }

        var c = (e && e.code) || "upstream_error";
        if (c === "cancelled") { bub.innerHTML = (e.text ? md(e.text) : "") + '<div class="asrc">중지됨</div>'; return; }
        if (c === "tools_unavailable") { AI.tools = false; bub.remove(); AI.ctl = null; sendBtn.textContent = "보내기"; askAI(q); return; }
        if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].indexOf(c) >= 0) { bub.remove(); aiOff("Claude 답변을 쓸 수 없어 빠른 계산으로 바꿨습니다."); ask(q); return; }
        bub.innerHTML = (c !== "refused" && e.text ? md(e.text) : "") + "<p>" + esc(ERR[c] || "일시적인 오류로 답을 받지 못했습니다. 다시 물어보세요.") + "</p>";
      }).then(function () { if (AI.ctl === ctl) { AI.ctl = null; sendBtn.textContent = "보내기"; } log.scrollTop = log.scrollHeight; });
    }
    function route(q) { if (AI.on) askAI(q); else ask(q); }
    pane.addEventListener("click", function (e) { var c = e.target.closest(".chipq"); if (c) route(c.textContent); });
    pane.querySelector(".askform").addEventListener("submit", function (e) { e.preventDefault(); if (AI.ctl) { AI.ctl.abort(); return; } route(input.value); input.value = ""; });
    if (window.claude && typeof window.claude.use === "function") {
      window.claude.use("sample").then(function (s) {
        if (!s) return;
        AI.sample = s; modeBar.hidden = false; setMode(true);
        push("bot", "<p><b>Claude 답변</b>을 켰습니다. 오늘 브리프 데이터를 근거로 자유롭게 물어보세요. 처음 질문할 때 사용 허락을 묻고, 사용량은 보는 사람의 Claude 계정에서 차감됩니다. 위 버튼으로 <b>빠른 계산</b>(로그인·사용량 불필요)으로 바꿀 수 있습니다.</p>");
        if (s.limits) s.limits().then(function (l) { AI.tools = !!(l && l.tools); }).catch(function () {});
      }).catch(function () {});
    }
  })();

  document.getElementById("foot").innerHTML = "<div>" + esc(B.meta.team) + " · " + esc(B.meta.status) + " · 참고자료이며 특정 상품의 투자권유를 목적으로 하지 않습니다. 수치는 각 출처의 기준일 값입니다.</div><ul>" + B.sources.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ul>";
})();
</script>
